id: guide-not-read-blocked
title: 跳过 guide 直接取数被阻断
path: 拒绝
covers:
  - FR-01.5 未读 guide 的工具调用被 PreToolUse 阻断
  - FR-03.2 PreToolUse 检查链
workspace: group-finance
skill: monthly-operation-report
request: 出 2025-09 的经营月报
input:
  period: "2025-09"

# 故意不读 guide，直接取数
steps:
  - id: revenue
    tool: erp.fetch_revenue
    args:
      period: "{{ input.period }}"

expect:
  state: BLOCKED
  errorCode: GUIDE_NOT_READ
  stoppedAtTool: mcp__erp__fetch_revenue
  events:
    - session.created
    - skill.loaded
    - source.activated
    - tool.call.requested
    - permission.decided
    - tool.call.failed
    - session.state.changed
  metricsPresent: []
  resultCount: 0
