id: credentials-missing-fails-closed
title: 凭据缺失时任务失败而不是拿空值继续跑
path: 凭据过期
covers:
  - FR-01.3 凭据由 CredentialManager 在运行时注入，不进入模型上下文
  - FR-01 验收标准：凭据不出现在模型上下文、日志和报表产物中
  - §8 安全：凭据不进上下文/日志
workspace: group-finance
skill: monthly-operation-report
request: 出 2025-09 的经营月报
input:
  period: "2025-09"
# 故意不注入开发凭据，模拟凭据过期/未配置
credentials: false

steps:
  - { id: guideErp, tool: datasentry__read_source_guide, args: { sourceSlug: erp } }
  - { id: revenue, tool: erp.fetch_revenue, args: { period: "{{ input.period }}" } }

expect:
  # 明确失败，而不是拿空字符串继续跑出一个看似正常的报表
  state: FAILED
  errorCode: CREDENTIAL_MISSING
  actionError: null
  stoppedAtTool: mcp__erp__fetch_revenue
  events:
    - session.created
    - guide.read
    - tool.call.requested
    - permission.decided
    - tool.call.failed
    - session.state.changed
  metricsPresent: []
  resultCount: 0
  reportStatus: null
  approvalCount: 0
