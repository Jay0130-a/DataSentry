# 一条命令跑起来：
#
#   docker compose up --build
#
#   WebUI   http://localhost:5173      （analyst / datasentry-analyst）
#   API     http://localhost:3000
#   收件箱  http://localhost:8025      （Mailpit，发布出去的信都在这里）
#
# 默认用 Mock 规划器：不调用模型、不产生费用。要接真实模型，自行在 app 的
# environment 里加 DATASENTRY_MODEL_PROVIDER / DATASENTRY_MODEL_API_KEY。

services:
  app:
    image: datasentry:local
    build:
      context: .
      args:
        # 网络受限时用镜像站：
        #   NODE_IMAGE=docker.m.daocloud.io/library/node:24-bookworm-slim docker compose build
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATASENTRY_MODEL_PROVIDER: mock
      # 发布走真实 SMTP，指向下面的 Mailpit
      DATASENTRY_SMTP_MODE: smtp
      DATASENTRY_SMTP_HOST: mailpit
      DATASENTRY_SMTP_PORT: "1025"
      DATASENTRY_SMTP_FROM: datasentry@example.com
      # 真实 IM 投递：把 key 放进 .env 后取消注释（默认走本地，不设这条）
      # DATASENTRY_CRED_WECOM_BOARD_ROOM: ${DATASENTRY_CRED_WECOM_BOARD_ROOM:-}
    volumes:
      - ds-data:/app/data
    depends_on:
      - mailpit
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24

  web:
    image: datasentry:local
    command: ["npm", "run", "dev:web"]
    ports:
      - "5173:5173"
    environment:
      # Vite 的 /api 代理指向 app
      DATASENTRY_BASE_URL: http://app:3000
      # 让 Vite 监听 0.0.0.0；不能用 npm 的 -- --host，npm 会把它当自己的参数吃掉
      VITE_HOST: 0.0.0.0
      # 后端容器负责播种，Web 容器不要重复生成数据
      DATASENTRY_SEED: "0"
    depends_on:
      app:
        condition: service_healthy

  # 本地收件箱。真实投递链路在容器里也是真的：SMTP → Mailpit。
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    ports:
      - "8025:8025"

volumes:
  ds-data:
